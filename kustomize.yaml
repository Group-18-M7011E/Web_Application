apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - k8s/backend.yaml
  - k8s/frontend.yaml
  - k8s/ingress.yaml
configMapGenerator:
  - name: backend-code
    files:
      - backend/app.py
      - backend/requirements.txt
  - name: frontend-files
    files:
      - frontend/index.html
      - frontend/style.css
      - frontend/script.js