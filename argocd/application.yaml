apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Group-18-M7011E/Web_Application.git
    targetRevision: main
    # Argo CD detects the Chart.yaml in this folder and renders it with Helm (values.yaml).
    path: charts/outlift
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
