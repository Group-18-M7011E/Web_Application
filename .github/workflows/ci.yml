# CI/CD for Outlift.
#
# Every push and pull request: run backend tests, build the frontend and check the Helm chart.
# Only on main, after all checks pass:
#   1. build both Docker images and push them to GitHub Container Registry (ghcr.io), tagged with the commit SHA
#   2. write that SHA into charts/outlift/values.yaml and commit it
# Argo CD watches main, sees the new image tag in Git and rolls out the new version (GitOps).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/group-18-m7011e

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Fails the pipeline if backend coverage drops below 50 % (REQ5).
      # Measures only application code (app.py), not the tests themselves.
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=50

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Type-checks with TypeScript, then bundles with Vite.
      - run: npm run build

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/outlift
      # Renders the manifests exactly as Argo CD will, so template errors show up here first.
      - run: helm template outlift charts/outlift --namespace myapp

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-build, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/outlift-${{ matrix.component }}:${{ github.sha }}
            ${{ env.REGISTRY }}/outlift-${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  update-image-tag:
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two runs must not write values.yaml at the same time.
    concurrency: update-image-tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write the new image tag into the Helm values
        env:
          TAG: ${{ github.sha }}
        # yq is preinstalled on GitHub's Ubuntu runners.
        run: yq -i '.backend.image.tag = strenv(TAG) | .frontend.image.tag = strenv(TAG)' charts/outlift/values.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Nothing to commit when a run for the same commit is repeated.
          if git diff --quiet; then exit 0; fi
          git commit -am "Deploy images ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
