apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: python:3.12-slim
          command:
            - sh
            - -c
            - pip install --no-cache-dir -r /app/requirements.txt && exec gunicorn -b 0.0.0.0:5000 --chdir /app app:app
          ports: [{ containerPort: 5000 }]
          readinessProbe:
            tcpSocket: { port: 5000 }
            initialDelaySeconds: 10
          volumeMounts:
            - { name: code, mountPath: /app }
      volumes:
        - name: code
          configMap: { name: backend-code }   # kustomize rewrites this to the hashed name
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 5000 }]